<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Sketch</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start; /* Align items to the top */
        }
        .image-container {
            flex-grow: 1; /* Takes up most of the available space */
            min-width: 300px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .image-container img {
            display: block;
            width: 100%;
            height: auto;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .button-container button {
            padding: 15px 20px;
            border: 1px solid #333;
            background-color: #f0f0f0;
            cursor: pointer;
        }
        .text-container {
            width: 80%; /* Adjust width based on sketch */
            padding: 20px;
            border: 1px solid #ccc;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="top-row">
        
        <!-- Image Box -->
        <div class="image-container">
            <img src="https://placehold.co/400x400/cccccc/333333?text=Image" alt="Placeholder image">
        </div>

        <!-- Button Stack -->
        <div class="button-container">
            <!-- Top Button -->
            <button>Button</button>
            <!-- Bottom Button -->
            <button>Button</button>
        </div>
    </div>

    <!-- Text Box -->
    <div class="text-container">
        Text
    </div>

</body>
</html>
